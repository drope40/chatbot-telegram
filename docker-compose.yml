services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-bot-clima
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Valores lidos do arquivo .env (NÃO versionar o .env)
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # Necessário para usar {{ $env.OPENWEATHER_API_KEY }} nas expressões
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # URL pública HTTPS (ngrok, Cloudflare Tunnel, domínio próprio...) exigida pelo webhook do Telegram
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
